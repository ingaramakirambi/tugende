<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugende Express | Dashboard</title>
    <!-- Link to separate CSS file -->
    <link rel="stylesheet" href="indexstyle.css">
</head>
<body>

<table class="dashboard" cellpadding="0" cellspacing="0">
    <tr>
        <!-- LEFT COLUMN - HOME PAGE -->
        <td class="left-col">
            <table style="width:100%; height:100%;" cellpadding="0" cellspacing="0">
                <tr>
                    <td class="home-frame-cell">
                        <iframe 
                            src="home.html" 
                            title="Bus Schedule & Information"
                            frameborder="0"
                            scrolling="yes">
                        </iframe>
                    </td>
                </tr>
            </table>
        </td>

        <!-- RIGHT COLUMN - LOGIN PANEL -->
        <td class="right-col">
            <table style="width:100%; height:100%;" cellpadding="0" cellspacing="0">
                <tr>
                    <td class="switch-group">
                        <a href="user_login.html" target="authFrame">USER LOGIN</a>
                        <a href="admin.html" target="authFrame">ADMIN LOGIN</a>
                    </td>
                </tr>
                <tr>
                    <td class="login-frame-cell">
                        <iframe 
                            name="authFrame"
                            id="authFrame"
                            src="user_login.html"
                            frameborder="0"
                            scrolling="no">
                        </iframe>
                    </td>
                </tr>
                <tr style="height:30%;">
                    <td class="info-note">
                        <!-- CLOCK DISPLAY – replaces time.is iframe -->
                        <div id="clock" class="clock-display">--:--:--</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- Clock update script -->
<script>
    function showTime() {
        var now = new Date();
        document.getElementById('clock').innerHTML = now.toLocaleTimeString();
    }
    showTime();
    setInterval(showTime, 1000);
</script>

</body>
</html>
